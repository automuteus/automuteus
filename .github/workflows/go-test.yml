name: test

on:
  push:
    branches:
      - '**'
      - '!l10n_master'
    tags:
      - '*.*.*'

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: settings-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgres://postgres:settings-test@localhost:5432/postgres?sslmode=disable
      TEST_REDIS_ADDR: localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # -p 1 runs packages one at a time. The live tests in internal/api, internal/ipn, pkg/storage, and storage
      # share this one Postgres, and pkg/storage's TestReadsTolerateNewColumns takes exclusive table locks
      # (ALTER TABLE) while the others insert, which deadlocks when packages overlap.
      - name: test
        run: go test -race -p 1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: true
