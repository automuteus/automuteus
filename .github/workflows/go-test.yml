name: test

on:
  push:
    branches:
      - '**'
      - '!l10n_master'
    tags:
      - '*.*.*'

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: test
        run: go test ./...